<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F6FB">
  <meta name="description" content="微记 —— 一个只保存在本机的轻量动态记录工具">
  <title>微记 · 记录此刻的一点点想法</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--one"></span>
    <span class="blob blob--two"></span>
    <span class="blob blob--three"></span>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5l1.8 4.7 4.7 1.8-4.7 1.8L12 16.5l-1.8-4.7L5.5 10l4.7-1.8L12 3.5z"/>
            <path d="M18 16.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1z"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-name">微记</h1>
          <p class="brand-sub">记录此刻的一点点想法</p>
        </div>
      </div>
      <span class="local-badge">
        <span class="local-dot" aria-hidden="true"></span>
        仅保存在本机
      </span>
    </div>
  </header>

  <main class="page">
    <section class="card composer" id="composer-card" aria-label="发布动态">
      <form id="composer" class="composer-form" novalidate>
        <label class="sr-only" for="composer-input">写下此刻的想法</label>
        <textarea
          id="composer-input"
          class="composer-input"
          rows="3"
          placeholder="此刻在想些什么？写下来，它会留在这一台设备上。"
          aria-describedby="char-counter"
        ></textarea>

        <div class="composer-tools">
          <span class="composer-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2.5"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            本地保存 · Ctrl / ⌘ + Enter 快速发布
          </span>

          <div class="composer-actions">
            <span class="counter" id="char-counter">还可输入 280 字</span>
            <button type="submit" class="btn-primary" id="submit-btn" disabled>发布</button>
          </div>
        </div>
      </form>
    </section>

    <section class="timeline-section" aria-label="动态时间线">
      <div class="timeline-head">
        <h2 class="timeline-title">动态</h2>
        <span class="post-count" id="post-count">0 条</span>
      </div>

      <ul class="timeline" id="timeline" hidden></ul>

      <div class="empty" id="empty-state">
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5V6.5A2.5 2.5 0 0 1 7.5 4h10A2.5 2.5 0 0 1 20 6.5v8z"/>
            <path d="M8.5 8.5h7M8.5 12h4.5"/>
          </svg>
        </span>
        <p class="empty-title">这里还很安静</p>
        <p class="empty-desc">写下第一条想法，它会第一时间出现在这里。</p>
        <button type="button" class="btn-ghost" id="empty-action">开始记录</button>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <p>所有内容都保存在这台设备的浏览器里，清理站点数据会一并清除。</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
